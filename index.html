<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수행평가 점수 조회</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-6">
    <!-- 헤더 -->
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">수행평가 점수 조회</h1>
      <p class="text-sm text-slate-500 mt-1">학번과 이름을 입력하여 점수를 확인하세요.</p>
    </div>

    <!-- 로그인 폼 -->
    <div id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">학번 (예: 10101)</label>
        <input type="text" id="inputStudentId" placeholder="학번을 입력하세요" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">이름</label>
        <input type="text" id="inputName" placeholder="이름을 입력하세요" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button onclick="searchScore()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">조회하기</button>
      <p id="errorMsg" class="text-red-500 text-sm text-center hidden mt-2"></p>
    </div>

    <!-- 로딩 표시 -->
    <div id="loading" class="hidden text-center py-4">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
      <p class="text-slate-500 text-sm mt-2">데이터를 불러오는 중입니다...</p>
    </div>

    <!-- 결과 화면 -->
    <div id="resultArea" class="hidden space-y-4 border-t pt-4">
      <div class="bg-blue-50 p-4 rounded-lg">
        <h2 class="font-bold text-lg text-blue-900" id="resStudentInfo"></h2>
      </div>
      <div id="scoreList" class="space-y-2">
        <!-- 점수 항목들이 동적으로 추가됨 -->
      </div>
      <button onclick="resetForm()" class="w-full border border-slate-300 hover:bg-slate-50 text-slate-600 font-semibold py-2 rounded-lg transition mt-4">다시 조회</button>
    </div>
  </div>

  <script>
    // ⚠️ 아래 URL 부분을 본인의 Apps Script 웹 앱 URL로 반드시 수정해 주세요!
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxYUEcZilGVURYWHQqS8pB2MvRvWAAAP725yGigmKbZ1ssGNlK5upvkhLhIkDTy_Q/exec
";

    let scoreData = [];

    // 페이지 로드 시 구글 시트 데이터 미리 불러오기
    window.onload = async function() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const json = await response.json();
        if (json.status === "success") {
          scoreData = json.data;
        }
      } catch (e) {
        console.error("데이터 로드 실패:", e);
      }
    };

    function searchScore() {
      const id = document.getElementById("inputStudentId").value.trim();
      const name = document.getElementById("inputName").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      
      errorMsg.classList.add("hidden");

      if (!id || !name) {
        showError("학번과 이름을 모두 입력해 주세요.");
        return;
      }

      if (scoreData.length === 0) {
        showError("데이터를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.");
        return;
      }

      // 데이터 검색 (ID와 이름 일치 여부 확인)
      const student = scoreData.find(s => String(s.ID) === id && String(s.name) === name);

      if (!student) {
        showError("일치하는 학생 정보를 찾을 수 없습니다.");
        return;
      }

      // 결과 표시
      document.getElementById("loginForm").classList.add("hidden");
      document.getElementById("resultArea").classList.remove("hidden");
      document.getElementById("resStudentInfo").innerText = `${student.ID} ${student.name} 학생 점수 결과`;

      const scoreList = document.getElementById("scoreList");
      scoreList.innerHTML = "";

      // ID, name, password를 제외한 나머지 평가 항목 표시
      Object.keys(student).forEach(key => {
        if (!["ID", "name", "password"].includes(key)) {
          const val = student[key] || "미입력";
          scoreList.innerHTML += `
            <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
              <span class="text-slate-600 font-medium">${key}</span>
              <span class="font-bold text-blue-600">${val}</span>
            </div>
          `;
        }
      });
    }

    function resetForm() {
      document.getElementById("inputStudentId").value = "";
      document.getElementById("inputName").value = "";
      document.getElementById("loginForm").classList.remove("hidden");
      document.getElementById("resultArea").classList.add("hidden");
    }

    function showError(msg) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.innerText = msg;
      errorMsg.classList.remove("hidden");
    }
  </script>

</body>
</html>
