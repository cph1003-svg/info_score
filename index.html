<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수행평가 점수 조회 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-6">
    <!-- 헤더 -->
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">수행평가 점수 조회</h1>
      <p class="text-sm text-slate-500 mt-1">학번, 이름, 생년월일(비밀번호)을 입력해 주세요.</p>
    </div>

    <!-- 입력 폼 -->
    <div id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">학번</label>
        <input type="text" id="inputStudentId" placeholder="예: 10101" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">이름</label>
        <input type="text" id="inputName" placeholder="예: 홍길동" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호 (생년월일 6자리)</label>
        <input type="password" id="inputPassword" placeholder="예: 060315" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button onclick="searchScore()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition shadow-md">점수 조회하기</button>
      <p id="errorMsg" class="text-red-500 text-sm text-center hidden font-medium mt-2"></p>
    </div>

    <!-- 조회 결과 화면 -->
    <div id="resultArea" class="hidden space-y-5 border-t pt-5">
      <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-center">
        <h2 class="font-bold text-lg text-blue-900" id="resStudentInfo"></h2>
        <p class="text-xs text-blue-600 mt-0.5">수행평가 영역별 점수 결과입니다.</p>
      </div>

      <!-- score1 ~ score4 표시 영역 -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 text-center">
          <span class="block text-xs font-semibold text-slate-500 mb-1">수행점수 1</span>
          <span class="text-2xl font-extrabold text-blue-600" id="resScore1">-</span>
        </div>
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 text-center">
          <span class="block text-xs font-semibold text-slate-500 mb-1">수행점수 2</span>
          <span class="text-2xl font-extrabold text-blue-600" id="resScore2">-</span>
        </div>
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 text-center">
          <span class="block text-xs font-semibold text-slate-500 mb-1">수행점수 3</span>
          <span class="text-2xl font-extrabold text-blue-600" id="resScore3">-</span>
        </div>
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 text-center">
          <span class="block text-xs font-semibold text-slate-500 mb-1">수행점수 4</span>
          <span class="text-2xl font-extrabold text-blue-600" id="resScore4">-</span>
        </div>
      </div>

      <button onclick="resetForm()" class="w-full border border-slate-300 hover:bg-slate-50 text-slate-600 font-semibold py-2.5 rounded-lg transition mt-2">다른 학번 조회</button>
    </div>
  </div>

  <script>
    // ⚠️ 구글 Apps Script 웹 앱 URL을 아래에 정확히 붙여넣으세요.
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcX7yX2Xa_YsSd4-9cq4fd6MaU3VCIBLXRZN4U7Gyr7T9Uqy0kGXmxeX0hN6CE_O0/exec";

    let scoreData = [];

    // 웹 페이지 접속 시 구글 시트 데이터 로드
    window.onload = async function() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const json = await response.json();
        if (json.status === "success") {
          scoreData = json.data;
        }
      } catch (e) {
        console.error("데이터 로드 중 오류가 발생했습니다:", e);
      }
    };

    function searchScore() {
      const id = document.getElementById("inputStudentId").value.trim();
      const name = document.getElementById("inputName").value.trim();
      const pw = document.getElementById("inputPassword").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      
      errorMsg.classList.add("hidden");

      if (!id || !name || !pw) {
        showError("학번, 이름, 비밀번호를 모두 입력해 주세요.");
        return;
      }

      if (scoreData.length === 0) {
        showError("데이터를 불러오는 중입니다. 2~3초 후 다시 시도해 주세요.");
        return;
      }

      // 학번(studentId), 이름(name), 비밀번호(password/생년월일) 3가지 일치 검사
      const student = scoreData.find(s => 
        String(s.studentId) === id && 
        String(s.name) === name && 
        String(s.password) === pw
      );

      if (!student) {
        showError("입력하신 정보와 일치하는 학생이 없습니다.");
        return;
      }

      // 결과 화면 데이터 바인딩
      document.getElementById("loginForm").classList.add("hidden");
      document.getElementById("resultArea").classList.remove("hidden");
      document.getElementById("resStudentInfo").innerText = `${student.studentId} ${student.name} 학생`;

      document.getElementById("resScore1").innerText = student.score1 || "0";
      document.getElementById("resScore2").innerText = student.score2 || "0";
      document.getElementById("resScore3").innerText = student.score3 || "0";
      document.getElementById("resScore4").innerText = student.score4 || "0";
    }

    function resetForm() {
      document.getElementById("inputStudentId").value = "";
      document.getElementById("inputName").value = "";
      document.getElementById("inputPassword").value = "";
      document.getElementById("loginForm").classList.remove("hidden");
      document.getElementById("resultArea").classList.add("hidden");
    }

    function showError(msg) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.innerText = msg;
      errorMsg.classList.remove("hidden");
    }
  </script>

</body>
</html>
