<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수행평가 점수 조회 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">

  <!-- 카드 전체 폭 (max-w-2xl) -->
  <div class="bg-white rounded-2xl shadow-xl border border-pink-100 w-full max-w-2xl p-6 sm:p-8 space-y-6">
    <!-- 헤더 -->
    <div class="text-center">
      <h1 class="text-2xl font-bold text-pink-900">수행평가 점수 조회</h1>
      <p class="text-sm text-pink-500 mt-1">학번, 이름, 생년월일(비밀번호)을 입력해 주세요.</p>
    </div>

    <!-- 입력 폼 -->
    <div id="loginForm" class="space-y-4 max-w-md mx-auto">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">학번</label>
        <input type="text" id="inputStudentId" placeholder="예: 10101" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">이름</label>
        <input type="text" id="inputName" placeholder="예: 홍길동" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호 (생년월일 6자리)</label>
        <input type="password" id="inputPassword" placeholder="예: 060315" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none">
      </div>
      <button onclick="searchScore()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-lg transition shadow-md shadow-pink-200">점수 조회하기</button>
      <p id="errorMsg" class="text-red-500 text-sm text-center hidden font-medium mt-2"></p>
    </div>

    <!-- 조회 결과 화면 -->
    <div id="resultArea" class="hidden space-y-6 border-t border-pink-100 pt-6">
      <div class="bg-pink-100/70 p-4 rounded-xl border border-pink-200 text-center">
        <h2 class="font-bold text-lg text-pink-900" id="resStudentInfo"></h2>
        <p class="text-xs text-pink-600 mt-0.5">수행평가 영역별 점수 결과입니다.</p>
      </div>

      <!-- score1 ~ score4 가로 4개 항목 배치 (grid-cols-4) -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        
        <!-- 수행점수 1 -->
        <div class="bg-pink-50/50 p-3.5 rounded-xl border border-pink-200 text-center flex flex-col justify-between">
          <div>
            <span class="block text-xs font-bold text-slate-700 mb-1">수행점수 1</span>
            <!-- 수행점수 1 설명 -->
            <span class="block text-[11px] text-pink-500 mb-2 leading-tight">과일배달</span>
          </div>
          <span class="text-2xl font-extrabold text-pink-600" id="resScore1">-</span>
        </div>

        <!-- 수행점수 2 -->
        <div class="bg-pink-50/50 p-3.5 rounded-xl border border-pink-200 text-center flex flex-col justify-between">
          <div>
            <span class="block text-xs font-bold text-slate-700 mb-1">수행점수 2</span>
            <!-- 수행점수 2 설명 -->
            <span class="block text-[11px] text-pink-500 mb-2 leading-tight">크리스마스 선물</span>
          </div>
          <span class="text-2xl font-extrabold text-pink-600" id="resScore2">-</span>
        </div>

        <!-- 수행점수 3 -->
        <div class="bg-pink-50/50 p-3.5 rounded-xl border border-pink-200 text-center flex flex-col justify-between">
          <div>
            <span class="block text-xs font-bold text-slate-700 mb-1">수행점수 3</span>
            <!-- 수행점수 3 설명 -->
            <span class="block text-[11px] text-pink-500 mb-2 leading-tight">디버깅 허들넘기</span>
          </div>
          <span class="text-2xl font-extrabold text-pink-600" id="resScore3">-</span>
        </div>

        <!-- 수행점수 4 -->
        <div class="bg-pink-50/50 p-3.5 rounded-xl border border-pink-200 text-center flex flex-col justify-between">
          <div>
            <span class="block text-xs font-bold text-slate-700 mb-1">수행점수 4</span>
            <!-- 수행점수 4 설명 -->
            <span class="block text-[11px] text-pink-500 mb-2 leading-tight">문제해결</span>
          </div>
          <span class="text-2xl font-extrabold text-pink-600" id="resScore4">-</span>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ⚠️ 구글 Apps Script 웹 앱 URL을 아래에 정확히 붙여넣으세요.
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcX7yX2Xa_YsSd4-9cq4fd6MaU3VCIBLXRZN4U7Gyr7T9Uqy0kGXmxeX0hN6CE_O0/exec";

    let scoreData = [];

    // 웹 페이지 접속 시 구글 시트 데이터 로드
    window.onload = async function() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const json = await response.json();
        if (json.status === "success") {
          scoreData = json.data;
        }
      } catch (e) {
        console.error("데이터 로드 중 오류가 발생했습니다:", e);
      }
    };

    function searchScore() {
      const id = document.getElementById("inputStudentId").value.trim();
      const name = document.getElementById("inputName").value.trim();
      const pw = document.getElementById("inputPassword").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      
      errorMsg.classList.add("hidden");

      if (!id || !name || !pw) {
        showError("학번, 이름, 비밀번호를 모두 입력해 주세요.");
        return;
      }

      if (scoreData.length === 0) {
        showError("데이터를 불러오는 중입니다. 2~3초 후 다시 시도해 주세요.");
        return;
      }

      // 학번, 이름, 비밀번호 3가지 조건 검사
      const student = scoreData.find(s => 
        String(s.studentId) === id && 
        String(s.name) === name && 
        String(s.password) === pw
      );

      if (!student) {
        showError("입력하신 정보와 일치하는 학생이 없습니다.");
        return;
      }

      // 결과 화면 데이터 바인딩 및 폼 숨기기
      document.getElementById("loginForm").classList.add("hidden");
      document.getElementById("resultArea").classList.remove("hidden");
      document.getElementById("resStudentInfo").innerText = `${student.studentId} ${student.name} 학생`;

      document.getElementById("resScore1").innerText = student.score1 || "0";
      document.getElementById("resScore2").innerText = student.score2 || "0";
      document.getElementById("resScore3").innerText = student.score3 || "0";
      document.getElementById("resScore4").innerText = student.score4 || "0";
    }

    function showError(msg) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.innerText = msg;
      errorMsg.classList.remove("hidden");
    }
  </script>

</body>
</html>
